name: "Build CrossCode"

on:
  push:
    # "**" (not "*") so pushes to slash-containing branches such as
    # feature/foo are built too — "*" does not match "/".
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    permissions:
      contents: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust and bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            node_modules
          key: ${{ runner.os }}-crosscode-v3-${{ hashFiles('src-tauri/Cargo.lock', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-crosscode-v3-
            ${{ matrix.platform }}-crosscode-
            ${{ runner.os }}-crosscode-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify native build tools
        shell: pwsh
        run: |
          perl --version | Select-Object -First 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun i --frozen-lockfile

      - name: Frontend typecheck and build
        run: bun run build

      - name: Frontend unit tests (UI builder, Xcode importer, file system)
        run: bun test src

      - name: Rust check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Clean old bundles
        shell: pwsh
        run: Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue

      - name: Build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ github.event_name == 'release' && '--bundles msi,nsis' || '--bundles nsis' }}
          uploadUpdaterJson: ${{ github.event_name == 'release' }}
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: |
            ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
